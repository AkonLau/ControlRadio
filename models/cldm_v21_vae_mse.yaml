model:
      target: ldm.models.autoencoder.AutoencoderKL
      params:
        image_key: 'jpg'
        embed_dim: 4
        monitor: val/rec_loss
        ddconfig:
          #attn_type: "vanilla-xformers"
          double_z: true
          z_channels: 4
          resolution: 256
          in_channels: 3
          out_ch: 3
          ch: 128
          ch_mult:
          - 1
          - 2
          - 4
          - 4
          num_res_blocks: 2
          attn_resolutions: []
          dropout: 0.0
        lossconfig:
          target: ldm.modules.losses.LPIPSWithDiscriminator
          params:
            disc_start: -1
            kl_weight: 0.0
            disc_weight: 0.0
            disc_factor: 0.0
            perceptual_weight: 0.0
            pixel_loss: 'l2'